schema_version: 1
batch:
  id: P62
  title: 'Implement P62: Plot Array Factor, Beamwidth, and Grating Lobes'
  goal: Implement Project 62 as an interactive MATLAB lesson answering 'How do aperture size and element spacing
    shape a beam pattern?' through visible cause and effect.
sources:
  product: products/dsp-radar-learning/product.yaml
  requirements:
  - products/dsp-radar-learning/PRD.md#cap-module-01---complete-module-implementation
  - products/dsp-radar-learning/acceptance.yaml#CAP-MODULE-01
  - modules/62-plot-array-factor-beamwidth-and-grating-lobes/README.md
  milestone: products/dsp-radar-learning/milestones/DRL-M7.md
  baseline_commit: 10069b5d976688302397922df4bd7ad69e823b22
  control_plane_repository: kpbianco/portfolio-control
  control_plane_path: products/dsp-radar-learning/batches/P62.yaml
  control_plane_revision: e00e41f067672bfe98209746ce4fc30780fdd160  # pragma: allowlist secret
dependencies:
- P61
scope:
  allowed_paths:
  - modules/62-plot-array-factor-beamwidth-and-grating-lobes/**
  - curriculum/modules.json
  - README.md
  - START_HERE.md
  - modules/README.md
  - bin/learn
  - docs/plans/P62-*.md
  - docs/evidence/P62-*.md
  - tests/test_p62*.py
  - tests/**/test_p62*.py
  - tests/p62/**
  - tests/**/p62/**
  - tests/test_curriculum.py
  - tests/test_learn_cli.py
  forbidden_paths:
  - .github/**
  - .codex/**
  - .agents/**
  - AGENTS.md
  - contracts/**
  - curriculum/phases.md
  - docs/ARCHITECTURE.md
  - docs/IMPLEMENTATION_CONTRACT.md
  - docs/TUTOR_PROTOCOL.md
  - Makefile
acceptance:
- 'Preserve the guiding question: How do aperture size and element spacing shape a beam pattern?'
- experiment.m has deterministic baseline, visible parameters, labeled plots/metrics, a sweep, and a broken case.
- lesson.md explains the DSP/radar model and limiting cases without syntax-first teaching.
- walkthrough.md guides baseline observation, one-variable changes, failure interpretation, and concept connection.
- checks.md tests interpretation and prediction.
- Dependencies are declared and essential behavior is not hidden behind an unexplained black box.
- Manifest status becomes implemented only after required files and checks pass.
- Evidence separates static validation from MATLAB runtime actually performed.
validation:
  local:
  - DSP_RADAR_VERIFY_PROFILE=contract python3 scripts/validate_curriculum.py
  - DSP_RADAR_VERIFY_PROFILE=quick python3 -m unittest discover -s tests -v
  - DSP_RADAR_VERIFY_PROFILE=full ./scripts/agent-verify.sh
  focused_tests_to_add:
  - P62 artifact completeness and manifest identity
  - P62 deterministic-input contract
  - P62 sweep and broken-case markers
  - P62 placeholder/black-box regression
  required_ci:
  - Control plane validation and target Quality validation
risk:
  class: moderate
  hazards:
  - wrong units or physical interpretation
  - MATLAB mechanics displace the concept
  - opaque toolbox use
  - unrelated module changes
  - unsupported runtime claims
  stop_conditions:
  - required data/toolbox has no approved fallback
  - changes exceed allowed paths
  - expected result conflicts with the governing model
rollback:
  strategy: Revert P62 implementation commits and restore only its manifest status to scaffolded.
evidence:
  output:
  - docs/evidence/P62-<date>.md
  - validation commands and exit results
  - figure/metric inventory with units
  - acceptance map and limitations
  - MATLAB version/toolboxes/results when executed
  claim_boundary: Module structure, deterministic contracts, and retained outputs only; no hardware, real-time,
    operational radar, or field validation is implied.
