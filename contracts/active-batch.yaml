schema_version: 1
batch:
  id: P27
  title: 'Implement P27: Use Monte Carlo Trials Instead of One Lucky Run'
  goal: Implement Project 27 as an interactive MATLAB lesson answering 'Why is one noise realization not enough
    to judge an algorithm?' through visible cause and effect.
sources:
  product: products/dsp-radar-learning/product.yaml
  requirements:
  - products/dsp-radar-learning/PRD.md#cap-module-01---complete-module-implementation
  - products/dsp-radar-learning/acceptance.yaml#CAP-MODULE-01
  - modules/27-use-monte-carlo-trials-instead-of-one-lucky-run/README.md
  milestone: products/dsp-radar-learning/milestones/DRL-M3.md
  baseline_commit: 10069b5d976688302397922df4bd7ad69e823b22
  control_plane_repository: kpbianco/portfolio-control
  control_plane_path: products/dsp-radar-learning/batches/P27.yaml
  control_plane_revision: aacf91301bff4dc4b52b52caf9d1cf1397ed693b
dependencies:
- P26
scope:
  allowed_paths:
  - modules/27-use-monte-carlo-trials-instead-of-one-lucky-run/**
  - curriculum/modules.json
  - README.md
  - START_HERE.md
  - modules/README.md
  - bin/learn
  - docs/plans/P27-*.md
  - docs/evidence/P27-*.md
  - tests/test_p27*.py
  - tests/**/test_p27*.py
  - tests/p27/**
  - tests/**/p27/**
