schema_version: 1
batch:
  id: P16
  title: 'Implement P16: Create an Analytic Signal with the Hilbert Transform'
  goal: Implement Project 16 as an interactive MATLAB lesson answering 'How can a real waveform be represented by
    a complex envelope?' through visible cause and effect.
sources:
  product: products/dsp-radar-learning/product.yaml
  requirements:
  - products/dsp-radar-learning/PRD.md#cap-module-01---complete-module-implementation
  - products/dsp-radar-learning/acceptance.yaml#CAP-MODULE-01
  - modules/16-create-an-analytic-signal-with-the-hilbert-transform/README.md
  milestone: products/dsp-radar-learning/milestones/DRL-M2.md
  baseline_commit: 10069b5d976688302397922df4bd7ad69e823b22
  control_plane_repository: kpbianco/portfolio-control
  control_plane_path: products/dsp-radar-learning/batches/P16.yaml
  control_plane_revision: 052d2e6cdcab369caf611ab26ac14b22a8a8d441
dependencies:
- P15
scope:
  allowed_paths:
  - modules/16-create-an-analytic-signal-with-the-hilbert-transform/**
  - curriculum/modules.json
  - README.md
  - START_HERE.md
  - modules/README.md
  - bin/learn
  - docs/plans/P16-*.md
  - docs/evidence/P16-*.md
  - tests/test_p16*.py
  - tests/**/test_p16*.py
  - tests/p16/**
  - tests/**/p16/**
  - tests/test_curriculum.py
  - tests/test_learn_cli.py
