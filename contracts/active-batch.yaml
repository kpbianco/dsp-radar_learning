schema_version: 1
batch:
  id: P02
  title: 'Implement P02: See Sampling as Taking Measurements'
  goal: Implement Project 2 as an interactive MATLAB lesson answering 'What information is lost when a continuous-looking
    signal is represented by discrete samples?' through visible cause and effect.
sources:
  product: products/dsp-radar-learning/product.yaml
  requirements:
  - products/dsp-radar-learning/PRD.md#cap-module-01---complete-module-implementation
  - products/dsp-radar-learning/acceptance.yaml#CAP-MODULE-01
  - modules/02-see-sampling-as-taking-measurements/README.md
  milestone: products/dsp-radar-learning/milestones/DRL-M1.md
  baseline_commit: 10069b5d976688302397922df4bd7ad69e823b22
  control_plane_repository: kpbianco/portfolio-control
  control_plane_path: products/dsp-radar-learning/batches/P02.yaml
  control_plane_revision: 6927192720209c0f306824f238ec904cc0bf3d41
dependencies:
- P01
scope:
  allowed_paths:
  - modules/02-see-sampling-as-taking-measurements/**
  - curriculum/modules.json
  - README.md
  - START_HERE.md
  - modules/README.md
  - bin/learn
  - docs/plans/P02-*.md
  - docs/evidence/P02-*.md
  - tests/test_p02*.py
  - tests/**/test_p02*.py
  - tests/p02/**
  - tests/**/p02/**
  - tests/test_curriculum.py
  - tests/test_learn_cli.py
  forbidden_paths:
  - .github/**
  - .codex/**
  - .agents/**
  - AGENTS.md
  - contracts/**
  - curriculum/phases.md
  - docs/ARCHITECTURE.md
  - docs/IMPLEMENTATION_CONTRACT.md
  - docs/TUTOR_PROTOCOL.md
