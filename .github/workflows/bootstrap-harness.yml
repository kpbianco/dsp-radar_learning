name: Bootstrap DSP radar tutor harness

on:
  push:
    branches: [agent/codex-learning-harness]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-learning-harness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize repository
        run: python3 scripts/bootstrap_payload.py
      - name: Verify materialized harness
        run: ./scripts/agent-verify.sh
      - name: Commit generated repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add interactive DSP radar learning harness'
          git push origin HEAD:agent/codex-learning-harness
